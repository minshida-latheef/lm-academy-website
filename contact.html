
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - LM Academy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="logo"><h2>LM <span>ACADEMY</span></h2></div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="course-grid.html">Courses</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>

        <a href="contact.html" class="nav-btn">Get Started</a>
    </div>
</header>

<section class="section">
    <div class="container">

        <h1>Contact <span>Us</span></h1>

        <p>We would love to hear from you.</p>

        <div class="contact-info">
            <h3>Email</h3>
            <p>hello@lmacademy.com</p>

            <h3>Phone</h3>
            <p>+91 98765 43210</p>

            <h3>Address</h3>
            <p>Your academy address here.</p>
        </div>

        <form id="contactForm">

            <label for="name">Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject"
                   placeholder="Enter subject">

            <label for="message">Message</label>
            <textarea id="message"
                      placeholder="Write your message"
                      rows="5" required></textarea>

            <button type="submit">Send Message</button>

            <p id="formMessage"></p>

        </form>

    </div>
</section>

<footer>
    <p>© 2026 LM Academy. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
